name: Actualizar precios

# Cada 15 minutos de lunes a viernes, en horario de mercado (horas en UTC: 5:00 a 21:59,
# que en España son aprox. de 7:00 a 23:59). También se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '*/15 5-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recuperar los últimos precios publicados
        run: |
          mkdir -p "$RUNNER_TEMP/salida"
          if git fetch -q --depth=1 origin precios; then
            git show FETCH_HEAD:precios.json > "$RUNNER_TEMP/previo.json" || echo '{}' > "$RUNNER_TEMP/previo.json"
          else
            echo '{}' > "$RUNNER_TEMP/previo.json"
          fi

      - name: Descargar precios
        run: node precios/actualizar.mjs "$RUNNER_TEMP/previo.json" "$RUNNER_TEMP/salida/precios.json"

      - name: Publicar en la rama precios
        working-directory: ${{ runner.temp }}/salida
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b precios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git commit -q -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" precios
