<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi reto de ahorro</title>
<meta name="description" content="Panel personal de ahorro: tu reto, tus ingresos de cada mes y tu cartera de inversión.">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi reto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Concepto: una columna en móvil con navegación abajo, rejilla de tarjetas en escritorio con navegación arriba. El reto manda y el resto lo sostiene. */
  --plane:#F1F4F7; --surface:#FBFCFD; --ink:#0E1A26; --ink-2:#4C5B69; --muted:#76838F;
  --line:#DEE4EA; --line-strong:#C3CCD5; --accent-soft:#E4EEFB; --on-accent:#FFFFFF;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-text:#006300; --bad-text:#c23232;
  --font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0E1319; --surface:#151B22; --ink:#EDF1F5; --ink-2:#B8C3CD; --muted:#8D9AA6;
    --line:#25303A; --line-strong:#34414D; --accent-soft:#16263A; --on-accent:#06101A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#0ca30c; --bad-text:#e66767; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plane:#0E1319; --surface:#151B22; --ink:#EDF1F5; --ink-2:#B8C3CD; --muted:#8D9AA6;
  --line:#25303A; --line-strong:#34414D; --accent-soft:#16263A; --on-accent:#06101A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-text:#0ca30c; --bad-text:#e66767; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--plane); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:20px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
h2{font-size:17px;font-weight:600}
p{margin:0}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start}
.top .tag{grid-column:1/-1;justify-self:start}
.theme{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface)}
.theme button{appearance:none;border:0;background:transparent;color:var(--ink-2);width:38px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.theme button svg{width:19px;height:19px}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.sub{color:var(--ink-2);margin-top:4px}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:6px;padding:4px 8px}
.note{color:var(--ink-2);font-size:14px;max-width:70ch}

/* navegación */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:600 15px var(--font-body);color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab svg{width:20px;height:20px;display:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;gap:0;
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:12px;padding:6px 2px;border-bottom:0;margin:0;border-radius:8px}
  .tab svg{display:block}
  .tab[aria-selected="true"]{background:var(--accent-soft)}
}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.hint{color:var(--ink-2);font-size:13.5px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--font-display);font-size:clamp(38px,9vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.big .of{font-size:.38em;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:10px;white-space:nowrap}
.pct{font-family:var(--font-display);font-size:26px;font-weight:600}
.bar{position:relative;height:14px;border-radius:4px;background:var(--line);margin:16px 0 8px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0;transition:width .4s}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.next{color:var(--ink-2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px 24px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--ink-2)}
.facts dd{margin:2px 0 0}
.facts .v{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.2}
.facts .s{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}

/* hitos */
.hitos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hitos li{display:grid;grid-template-columns:22px 76px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hitos li:first-child{border-top:0}
.hitos .amt{font-weight:600}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini>i{display:block;height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.hitos .st{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.hitos li>span:first-child{display:grid;place-items:center}
.hitos svg{width:16px;height:16px}
.facts .v{display:block}
.ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong)}
.ring.now{border-color:var(--s1)}

/* barras apiladas y leyendas */
.stackbar{display:flex;gap:2px;height:16px;margin:6px 0 14px}
.stackbar i{display:block;min-width:2px;border-radius:2px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center}
.legend .sw,.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .p{color:var(--ink-2);min-width:44px;text-align:right}
.legend .a{min-width:64px;text-align:right;font-weight:600}
.total-line{display:flex;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.total-line b{font-family:var(--font-display);font-size:20px}

/* estados */
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px 3px 6px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip svg{width:16px;height:16px;flex:none}
.cumpl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cumpl li{display:grid;grid-template-columns:96px auto 1fr;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cumpl li:first-child{border-top:0}
.cumpl .m{font-weight:600;text-transform:capitalize}
.cumpl .d{grid-column:2/4;color:var(--ink-2);font-size:13.5px}
.alert{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.up{color:var(--good-text);font-weight:600}
.down{color:var(--bad-text);font-weight:600}

/* cartera mini */
.pl{display:grid;grid-template-columns:1fr 70px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl .w{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl .w i{display:block;height:100%;background:var(--s2);border-radius:0 3px 3px 0}
.pl .r{text-align:right;min-width:52px;font-size:13.5px}

/* botones y formularios */
.btn{appearance:none;border:1px solid var(--s1);background:var(--s1);color:var(--on-accent);font:600 14.5px var(--font-body);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn:hover{filter:brightness(.95)}
.sec-head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-end}
.sec-head p{color:var(--ink-2);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mhead h3{font-size:17px;text-transform:capitalize}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--ink-2)}
input,select{font:16px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.mfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.prow{display:grid;grid-template-columns:12px 1fr 84px 20px 72px;gap:10px;align-items:center;padding:6px 0}
.prow .amt{text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
tfoot td{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.2}
.kpi .l{font-size:13px;color:var(--ink-2)}
.priceRow{display:grid;grid-template-columns:1fr 130px 70px;gap:10px;align-items:center;padding:6px 0}
.priceRow .src{font-size:12.5px;color:var(--ink-2)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 12px;align-items:end}
.ok-msg{color:var(--ink-2);font-size:13.5px;margin-top:8px;min-height:1.4em}
@media (max-width:480px){
  .hitos li{grid-template-columns:22px 64px 1fr;}
  .hitos .st{grid-column:2/4;text-align:left}
  .cumpl li{grid-template-columns:1fr auto}
  .cumpl .bw{grid-column:1/3}
  .cumpl .d{grid-column:1/3}
  .prow{grid-template-columns:12px 1fr 72px 16px 60px;gap:8px}
  .priceRow{grid-template-columns:1fr 110px}
  .priceRow .src{display:none}
}
/* cartera: lista de activos con desplegable */
.pricebar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.pricebar>div{flex:1 1 320px;min-width:0}
.pricebar .hint{margin-top:2px}
.pos-head,.pos-btn,.pos-tot{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(5,minmax(72px,1fr));gap:4px 10px;align-items:center;text-align:right;width:100%}
.pos-head{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:0 8px 8px}
.pos-head>span:first-child,.pos-btn>span:first-child,.pos-tot>span:first-child{text-align:left}
.pos{border-top:1px solid var(--line)}
.pos-btn{appearance:none;background:none;border:0;border-radius:8px;padding:12px 8px;font:inherit;color:var(--ink);cursor:pointer}
.pos-btn:hover{background:var(--accent-soft)}
.pos-btn .nm{display:flex;gap:8px;align-items:center;font-weight:600}
.pos-btn .nm svg{width:16px;height:16px;flex:none;transition:transform .15s}
.pos-btn[aria-expanded="true"] .nm svg{transform:rotate(90deg)}
.pos-tot{border-top:1px solid var(--line-strong);padding:12px 8px 0;font-weight:700}
.det{padding:2px 8px 14px 32px}
.det-sum{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--ink-2);font-size:13.5px;margin-bottom:6px}
.det-sum b{color:var(--ink)}
.cp{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.cp span{display:block;font-size:11.5px;color:var(--ink-2)}
.cp b{font-weight:600}
@media (max-width:639px){
  .pos-head{display:none}
  .pos-btn,.pos-tot{grid-template-columns:repeat(3,1fr);text-align:left}
  .pos-btn>span:first-child,.pos-tot>span:first-child{grid-column:1/-1}
  .pos-btn>span[data-l]::before,.pos-tot>span[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--ink-2);font-weight:500}
  .det{padding-left:8px}
}
.tag2{font-style:normal;font-size:11.5px;font-weight:600;border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;margin-left:8px;color:var(--ink-2)}
.sub-h{margin:14px 0 0;font:600 12px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--s1)}
.actions{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
input:disabled,select:disabled,button:disabled{opacity:.55;cursor:not-allowed}
input[readonly]{background:var(--plane)}
.nmt small{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.grp{display:flex;flex-direction:column;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.mhead+.grp,.confirm+.grp{margin-top:0;border-top:0;padding-top:0}
.grp-t{font:600 12px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.mh-r{display:flex;gap:8px;align-items:center}
.icon-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.confirm{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.mfoot{flex-direction:column;align-items:stretch;gap:8px}
.mr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:baseline}
.mr b{color:var(--ink)}
.mr small{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.addm{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addm .f{width:170px}
.crow{display:grid;grid-template-columns:12px minmax(0,1fr) 104px 80px 34px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .cn{font-weight:600;min-width:0}
.crow .cn small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.crow .cp-in{display:flex;gap:6px;align-items:center}
.crow .amt{text-align:right;font-weight:600}
.icon-sp{width:34px}
.pf-sum{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cat-add{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cat-add .f{flex:1 1 200px}
.cat-add .nc-p{flex:0 0 90px}
@media (max-width:480px){
  .crow{grid-template-columns:12px minmax(0,1fr) 34px;grid-template-areas:"sw n d" ". p a"}
  .crow>.sw{grid-area:sw}.crow>.cn,.crow>.cn-in{grid-area:n}.crow>.cp-in{grid-area:p}.crow>.amt{grid-area:a}.crow>.icon-btn,.crow>.icon-sp{grid-area:d}
}
.auto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 12px;border-radius:8px;background:var(--plane)}
.auto b{font-family:var(--font-display);font-size:20px;font-weight:600}
.auto small{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.mes-list{display:flex;flex-direction:column;gap:10px}
.card.mes{padding:0}
.mes-btn{appearance:none;width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:12px;padding:14px 18px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.mes-btn:hover{background:var(--accent-soft)}
.mes-btn>svg{width:16px;height:16px;flex:none;color:var(--ink-2);transition:transform .15s}
.mes-btn[aria-expanded="true"]>svg{transform:rotate(90deg)}
.mes-n{font-family:var(--font-display);font-size:17px;font-weight:600;text-transform:capitalize}
.mes-btn .tag2{margin-left:0}
.mes-chip{margin-left:auto}
.mes.is-open .mes-btn{border-radius:12px 12px 0 0}
.mes-body{padding:0 18px 18px}
.mes-body>.grp:first-child{margin-top:4px;border-top:0;padding-top:0}
.mact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mact .mdel{margin-left:auto}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn svg{width:18px;height:18px;flex:none}
.mact .confirm,.mes-body>.confirm{margin:12px 0 0}
.cp-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cp-act.confirm{padding:8px 10px;border-radius:8px;background:var(--accent-soft);margin:0}
.link-btn{appearance:none;background:none;border:1px solid var(--line-strong);border-radius:6px;padding:4px 10px;font:600 13px var(--font-body);color:var(--ink);cursor:pointer}
.link-btn:hover{background:var(--accent-soft)}
.cp-edit{background:var(--plane);border-radius:8px;padding:12px;margin:6px 0;border-top:0;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cp-edit .ok-msg{grid-column:1/-1;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- app real ---------- */
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.priceRow{grid-template-columns:minmax(0,1fr) 140px 110px minmax(120px,auto)}
.priceRow .pn{font-weight:600;min-width:0}
.priceRow .pl-live{font-weight:700;text-align:right;padding:0 4px}
.priceRow .src{font-size:12.5px}
@media (max-width:640px){.priceRow{grid-template-columns:minmax(0,1fr) 110px;row-gap:4px}.priceRow .src{display:block!important;grid-column:1/-1}}
/* cartera: acciones, detalle, ventas, correcciones */
.cart-actions{display:flex;flex-wrap:wrap;gap:8px}
.cart-actions .btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--s1)}
#cpanels{display:flex;flex-direction:column;gap:16px}
#cpanels:not(:has(.cpanel:not([hidden]))){display:none}
.det-txt{margin:0 0 8px;color:var(--ink-2);max-width:70ch}
.lots{overflow-x:auto;margin-top:4px}
.lots-in{min-width:560px}
.lot-row{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lot-row>span:not(:first-child){text-align:right}
.lot-head,.ops-head{font-size:12px;font-weight:600;color:var(--ink-2);border-top:0}
.ops-tg{margin-top:12px}
.ops{overflow-x:auto;margin-top:8px}
.ops-in{min-width:620px}
.ops-row{display:grid;grid-template-columns:minmax(120px,1.4fr) 96px repeat(3,minmax(0,1fr)) minmax(140px,auto);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ops-row>span:nth-child(n+3):nth-child(-n+5){text-align:right}
.ops-row .cp-act{grid-column:auto;justify-content:flex-end}
.ops-row .cp-act.confirm{grid-column:1/-1;justify-content:flex-start}
.ops .cp-edit{margin:8px 0}
/* panel: gráfico circular */
.donut-wrap{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center}
.donut{position:relative;width:180px;height:180px;flex:none}
.donut svg{width:180px;height:180px;display:block}
.donut circle{transition:opacity .15s}
.donut circle:hover{opacity:.8}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.donut-c b{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1}
.donut-c span{font-size:12.5px;font-weight:600}
.donut-lg{flex:1 1 180px;min-width:0}
.donut-lg li{grid-template-columns:12px minmax(0,1fr) auto}
.donut-lg .ln{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.ro .ro-keep{display:inline-flex!important}
body.ro .ops-tg{display:none!important}
.lot-row>span,.ops-row>span.num{white-space:nowrap}
.big{white-space:nowrap}
.pct{white-space:nowrap}
.hero-top{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.donut circle{transition:none}}
.save-st{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.save-st.st-error,.save-st.st-offline{color:var(--bad-text)}
.save-st.st-pend,.save-st.st-saving{color:var(--ink-2)}
.center-screen{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--ink-2)}
.login-card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}
.login-card h1{font-size:28px}
.login-card .btn{align-self:flex-start;padding:11px 18px}
.welcome{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.welcome h2{font-size:24px}
.welcome p{max-width:62ch;color:var(--ink-2)}
.ro-only{display:none}
body.ro .ro-only{display:block}
body.ro .ro-hide,body.ro #f-mes,body.ro .mact,body.ro .cp-act,body.ro .cat-add,body.ro [data-cdel],body.ro [data-del],
body.ro #go-mes,body.ro #go-dirty,body.ro .card:has(#f-compra),body.ro .card:has(#f-venta),body.ro .card:has(#f-activo){display:none!important}
body.ro .crow{grid-template-columns:12px minmax(0,1fr) 104px 80px}
body.ro main input:disabled,body.ro main select:disabled{opacity:1;cursor:default;background:var(--plane)}
</style>
</head>
<body>
<div id="loading" class="center-screen"><p id="loading-msg">Cargando…</p></div>

<div id="login" class="center-screen" hidden>
  <section class="card login-card">
    <div class="eyebrow">Mi reto de ahorro</div>
    <h1>Entra en tu panel</h1>
    <p class="hint">Inicia sesión con tu cuenta de Google. Tus datos se guardan en tu cuenta y solo tú puedes verlos.</p>
    <button class="btn" type="button" id="btn-login">Entrar con Google</button>
    <p class="ok-msg" id="login-msg" aria-live="polite"></p>
    <button class="btn ghost" type="button" id="btn-login-out" hidden>Cerrar sesión</button>
  </section>
</div>
<div class="app" id="app" hidden>
  <header class="top">
    <div>
      <h1 id="h-meta">Mi reto</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="top-r">
      <span class="save-st" id="save-st" aria-live="polite"></span>
      <div class="theme" role="group" aria-label="Tema de color">
      <button type="button" id="th-light" aria-pressed="true" aria-label="Modo claro" title="Modo claro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" id="th-dark" aria-pressed="false" aria-label="Modo oscuro" title="Modo oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      </button>
    </div>
      <button type="button" class="icon-btn" id="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" id="tab-panel" data-tab="panel" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/></svg>Panel</button>
    <button class="tab" role="tab" id="tab-ingresos" data-tab="ingresos" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Ingresos</button>
    <button class="tab" role="tab" id="tab-cartera" data-tab="cartera" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Cartera</button>
    <button class="tab" role="tab" id="tab-perfil" data-tab="perfil" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </nav>

  <p class="note ro-note" id="ro-note" hidden>Modo consulta: desde el móvil solo puedes ver tus datos. Apúntalos desde el ordenador.</p>

  <main>
    <section id="view-panel" role="tabpanel" aria-labelledby="tab-panel" class="stack"></section>
    <section id="view-ingresos" role="tabpanel" aria-labelledby="tab-ingresos" class="stack" hidden></section>
    <section id="view-cartera" role="tabpanel" aria-labelledby="tab-cartera" class="stack" hidden></section>
    <section id="view-perfil" role="tabpanel" aria-labelledby="tab-perfil" class="stack" hidden></section>
  </main>
</div>

<script src="app.js"></script>
<script type="module" src="firebase.js"></script>
<script>
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
  setTimeout(function(){var l=document.getElementById('loading');if(l&&!l.hidden){document.getElementById('loading-msg').textContent='No se pudo conectar. Revisa tu conexión a internet y recarga la página.'}},20000);
</script>
</body>
</html>
